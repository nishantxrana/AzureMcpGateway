# ADO MCP Gateway - build, package, deploy (zip + Run-From-Package), verify, swap.
#
# One-time setup (see PREREQUISITES.md section H):
#   1. Azure Resource Manager service connection using WORKLOAD IDENTITY FEDERATION,
#      scoped to the resource group. Put its name in `serviceConnection` below.
#   2. That connection's identity needs: Contributor on the web app, and
#      "Key Vault Secrets User" on the vault (verification reads keys at run time,
#      so no key is ever stored as a pipeline variable).
#   3. Create an Environment named `production` and add an APPROVAL check to it.
#      (If useStagingSlot is true, also create an Environment named `staging`.)
#   4. Branch policy on main: PR required + this pipeline as build validation.
#
# Standard (S1) or Premium (P0v3) plans support slots. B1 does not: set
# useStagingSlot=false and the pipeline deploys straight to production behind the
# approval gate, with the verification run immediately afterwards.

trigger:
  branches:
    include: [main]
pr:
  branches:
    include: [main]

variables:
  nodeVersion: 22.x
  zipDir: $(Pipeline.Workspace)/package

stages:
  # ------------------------------------------------------------------ build
  - stage: Build
    displayName: Build, test, package (Linux)
    jobs:
      - job: build
        pool:
          vmImage: ubuntu-latest # MUST be Linux: the zip contains native Linux binaries
        steps:
          - task: NodeTool@0
            displayName: Use Node $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            displayName: npm ci

          # lint + build + typecheck + unit and integration tests, offline (fake ADO child)
          - script: npm run verify:local
            displayName: verify:local

          # fails when Microsoft's tool/action list changed or an action is unreviewed
          - script: npm run verify:drift
            displayName: verify:drift

          - script: npm run verify:secrets
            displayName: verify:secrets

          - script: npm audit --omit=dev --audit-level=high
            displayName: npm audit (production dependencies)

          # npm ci -> build -> test -> production node_modules -> zip + sha256
          - script: node scripts/package.mjs
            displayName: Package (Linux only)

          - script: |
              set -e
              ZIP=$(ls artifacts/gateway-*.zip | head -n 1)
              node scripts/verify/package.mjs --zip "$ZIP"
            displayName: verify:package (entries, pin, ELF natives, smoke start)

          - task: CopyFiles@2
            displayName: Stage package
            inputs:
              SourceFolder: artifacts
              Contents: |
                gateway-*.zip
                gateway-*.zip.sha256
              TargetFolder: $(Build.ArtifactStagingDirectory)

          - task: PublishPipelineArtifact@1
            displayName: Publish package artifact
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: package
